<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<title>Dev Room Wallpaper</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: full-screen isometric room; tiny hint pill at the bottom */
:root{--bg:#4f5d78;--ink:#f2efe9;--panel:rgba(40,46,58,.55);--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--mono)}
[hidden]{display:none!important}
canvas{display:block;touch-action:none;cursor:grab}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:11px;background:var(--panel);border-radius:8px;padding:7px 12px;backdrop-filter:blur(8px);max-width:calc(100vw - 32px);box-sizing:border-box;text-align:center;line-height:1.5}
.lockbtn{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));right:14px;font:700 12px var(--mono);color:var(--ink);background:var(--panel);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px)}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,16,.5);padding:16px;box-sizing:border-box}
.card{width:min(540px,100%);max-height:90%;overflow:auto;background:#1b1f27;border:1px solid #2d333d;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.card h2{margin:0;font-size:15px}
.card p{margin:0;font-size:12px;color:#9aa4b2;line-height:1.5}
.card input[type=text],.card input[type=password]{font:14px var(--mono);color:var(--ink);background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px 10px;min-width:0;flex:1}
.card button{font:700 12px var(--mono);color:var(--ink);background:#2b313c;border:1px solid #3a414d;border-radius:6px;padding:8px 12px;cursor:pointer}
.card button.pri{background:#1f6feb;border-color:#1f6feb}
.card button.warn{color:#ff8a80}
.card button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid #58a6ff;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.goal{border:1px solid #2d333d;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.hash{color:#d2a8ff;font-size:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.steps li{display:flex;gap:8px;align-items:center;font-size:13px}
.steps li label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.steps li.done label{color:#6e7781;text-decoration:line-through}
.steps input[type=checkbox]{accent-color:#3fb950;width:16px;height:16px}
.card button.x{background:none;border:none;color:#6e7781;padding:2px 6px}
.meter{height:4px;background:#2d333d;border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:#3fb950}
.err{color:#ff8a80;font-size:12px;min-height:1em}
.ctl{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:stretch;gap:4px;max-width:calc(100vw - 28px);padding:5px;border-radius:10px;background:rgba(17,20,27,.55);backdrop-filter:blur(8px);opacity:.35;transition:opacity .3s}
.ctl:hover,.ctl:focus-within{opacity:1}
.ctl button{font:700 12px var(--mono);color:#e6edf3;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:7px 10px;cursor:pointer;min-width:34px}
.ctl button:hover{background:rgba(255,255,255,.18)}
.ctl button.on{background:#1f6feb;border-color:#1f6feb}
.ctl .sep{height:1px;background:rgba(255,255,255,.15);margin:2px 0}
.hint{bottom:auto!important;top:calc(44px + env(safe-area-inset-top,0px))}
.focus{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:min(400px,calc(100vw - 28px));box-sizing:border-box;background:rgba(17,20,27,.74);border:1px solid rgba(255,255,255,.12);border-left:3px solid #3fb950;border-radius:10px;padding:14px 16px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:9px}
.focus .eb{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8b95a7;overflow-wrap:anywhere}
.focus .step{font-size:clamp(17px,2.4vw,22px);font-weight:700;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.focus .meta{font-size:12px;color:#c9d1d9}
.focus button{font:700 13px var(--mono);color:#0d1117;background:#3fb950;border:none;border-radius:6px;padding:9px 14px;cursor:pointer}
.focus button.sec{background:rgba(255,255,255,.1);color:var(--ink)}
.focus .quote{font-size:12px;color:#aeb7c2;font-style:italic;border-top:1px solid rgba(255,255,255,.08);padding-top:8px}
.focus .step.blur{filter:blur(8px);user-select:none;transition:filter .25s;cursor:pointer}
.focus:hover .step.blur,.focus.peek .step.blur{filter:none}
.focus.private .eb::after{content:" · hover to read";color:#59636e}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font:700 17px var(--mono);background:#1a7f37;color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-70%)}
@media (max-width:560px){.focus{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
</style>
<div class="hint" id="hint">Drag to rotate · scroll to zoom · double-click to fly in · keys 1–5 fly to spots · F tour · 0 reset · V space/city · G goals</div>
<button class="lockbtn" id="lockBtn">🔒 Goals</button>
<nav class="ctl" id="ctl" aria-label="Camera controls">
  <button type="button" data-a="zout" title="Zoom out">−</button><button type="button" data-a="zin" title="Zoom in">+</button>
  <button type="button" data-a="rl" title="Rotate left">⟲</button><button type="button" data-a="rr" title="Rotate right">⟳</button>
  <span class="sep"></span>
  <button type="button" data-a="1">Desk</button><button type="button" data-a="2">Buddha</button><button type="button" data-a="3">Mindset</button><button type="button" data-a="5">Window</button><button type="button" data-a="0">Room</button>
  <span class="sep"></span>
  <button type="button" data-a="tour" id="tourBtn">▶ Tour</button>
</nav>
<button class="lockbtn" id="viewBtn" style="top:calc(84px + env(safe-area-inset-top,0px))">🌆 City view</button>

<div class="modal" id="modal" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

function streak(){const set=new Set(LOG);let n=0;const d=new Date();const key=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
 if(!set.has(key(d)))d.setDate(d.getDate()-1);while(set.has(key(d))){n++;d.setDate(d.getDate()-1)}return n}
function updateFocus(){}
let lastAct=performance.now();const act=()=>{lastAct=performance.now()};
['pointerdown','wheel','keydown','touchstart'].forEach(ev=>addEventListener(ev,act,{passive:true}));
const tourBtn=document.getElementById('tourBtn');const syncTour=()=>{tourBtn.textContent=tour?'■ Stop tour':'▶ Tour';tourBtn.classList.toggle('on',!!tour)};
document.getElementById('ctl').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;act();
 if(a==='zin')zoomT=Math.min(4.5,zoomT*1.3);else if(a==='zout'){zoomT=Math.max(.8,zoomT/1.3);if(zoomT<1.05)lookT.set(0,2.6,-1.5)}
 else if(a==='rl')tyaw=Math.max(.15,tyaw-.3);else if(a==='rr')tyaw=Math.min(1.4,tyaw+.3);
 else if(a==='tour'){toggleTour();syncTour();return}else{stopTour();flyTo(a)}syncTour()});
// start a slow tour on its own after 1 minute without input (keeps the wallpaper alive)
setInterval(()=>{if(!tour&&$m.hidden&&performance.now()-lastAct>60000){toggleTour();syncTour()}},5000);
addEventListener('pointerdown',()=>setTimeout(syncTour,0));
document.getElementById('viewBtn').onclick=()=>setView(VIEW==='space'?'city':'space');
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='v'||e.key==='V')setView(VIEW==='space'?'city':'space')});
setView(VIEW);
setTimeout(()=>{const h=document.getElementById('hint');if(h){h.style.transition='opacity 1s';h.style.opacity=0}},14000);
})();
